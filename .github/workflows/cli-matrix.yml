name: CLI-All-Platforms

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  # 创建 Release（只运行一次，避免重复创建）
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare Release Notes
        id: release_body
        run: |
          git fetch --tags --force
          RELEASE_BODY_FILE=$(mktemp)
          if [ -f "CHANGELOG.md" ]; then
            cat CHANGELOG.md > "$RELEASE_BODY_FILE"
          else
            git log -1 --pretty=%B > "$RELEASE_BODY_FILE"
          fi
          {
            echo "body<<EOF"
            cat "$RELEASE_BODY_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          rm -f "$RELEASE_BODY_FILE"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: GDownload ${{ github.ref_name }} autobuild
          body: ${{ steps.release_body.outputs.body }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [create-release]
    if: |
      !cancelled() &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target: [linux, macos-arm64, macos-x64, windows]
        # macOS 构建说明：
        # - 分别构建 ARM64 和 x86_64 架构
        # - 通过 merge-macos-universal 任务合并为 Universal Binary
        # - 避免 vcpkg 在多架构模式下的构建失败问题
        include:
          - target: linux
            os: ubuntu-latest
            qt_version: 6.10.1
            qt_arch: linux_gcc_64
            vcpkg_triplet: x64-linux-release
            install_prefix: linux_package
            release_glob: release_artifacts/linux/*.AppImag*
            cmake_extra: ""
          - target: macos-arm64
            os: macos-latest
            qt_version: 6.10.1
            qt_arch: clang_64
            vcpkg_triplet: arm64-osx-release
            install_prefix: macos_arm64_package
            cmake_arch: arm64
            artifact_name: macos-arm64-app
            release_glob: release_artifacts/macos-arm64/*.dmg
            cmake_extra: "-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang"
          - target: macos-x64
            os: macos-latest
            qt_version: 6.10.1
            qt_arch: clang_64
            vcpkg_triplet: x64-osx-release
            install_prefix: macos_x64_package
            cmake_arch: x86_64
            artifact_name: macos-x64-app
            release_glob: release_artifacts/macos-x64/*.dmg
            cmake_extra: "-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang"
          - target: windows
            os: windows-latest
            qt_version: 6.10.1
            qt_arch: win64_msvc2022_64
            vcpkg_triplet: x64-windows-release
            install_prefix: windows_package
            release_glob: release_artifacts/windows/*.exe
            msvc_arch: x64
            cmake_extra: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Prepare Release Directory
        run: |
          mkdir -p release_artifacts/${{ matrix.target }}

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          modules: qt3d qtimageformats qtwebsockets qt5compat qtshadertools

      - name: Set QTDIR (Unix)
        if: runner.os != 'Windows'
        run: |
          QT_DIR_VALUE="${QT_ROOT_DIR:-}"
          if [ -z "${QT_DIR_VALUE}" ] && [ -n "${Qt6_DIR:-}" ]; then
            QT_DIR_VALUE="$(cd "${Qt6_DIR}/../.." && pwd)"
          fi
          if [ -z "${QT_DIR_VALUE}" ]; then
            echo "Neither QT_ROOT_DIR nor Qt6_DIR is set after install-qt-action."
            exit 1
          fi
          echo "QTDIR=${QT_DIR_VALUE}" >> "$GITHUB_ENV"

      - name: Set QTDIR (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          setlocal
          if "%QT_ROOT_DIR%"=="" (
            if "%Qt6_DIR%"=="" (
              echo Neither QT_ROOT_DIR nor Qt6_DIR is defined after install-qt-action.
              exit /b 1
            )
            for %%I in ("%Qt6_DIR%\..\..") do set "QT_ROOT_DIR=%%~fI"
          )
          set "QTDIR=%QT_ROOT_DIR%"
          if "%QTDIR%"=="" (
            echo QTDIR could not be determined.
            exit /b 1
          )
          echo QTDIR=%QTDIR%>>"%GITHUB_ENV%"
          endlocal

      - name: Install Linux Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libdrm-dev libappimage-dev libxdg-basedir-dev xdg-utils-cxx xdg-utils-cxx-dev mesa-common-dev build-essential libssl-dev autoconf automake libtool wget vim-common desktop-file-utils pkgconf libgpgme-dev libglib2.0-dev libcairo2-dev librsvg2-dev libfuse-dev git libcurl4-openssl-dev argagg-dev libgcrypt20-dev libboost-dev liblzma-dev libzstd-dev zlib1g-dev libarchive-dev libx11-dev libxpm-dev ninja-build libxkbcommon-dev libxkbcommon-x11-0 libxkbcommon-x11-dev xkb-data

      - name: Install macOS Tools
        if: startsWith(matrix.target, 'macos-')
        run: |
          brew install create-dmg ninja

      - name: Cache AppImage Tools
        if: matrix.target == 'linux'
        uses: actions/cache@v4
        with:
          path: tools
          key: appimage-tools-${{ runner.os }}-${{ hashFiles('.github/workflows/cli-matrix.yml') }}

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
            ~/.cache/vcpkg/archives
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
            ~/Library/Caches/vcpkg/archives
          key: vcpkg-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'custom-triplets/**') }}
          restore-keys: |
            vcpkg-${{ matrix.vcpkg_triplet }}-
            vcpkg-

      - name: Setup vcpkg
        id: vcpkg
        uses: johnwason/vcpkg-action@v6
        env:
          VCPKG_MAX_CONCURRENCY: 4
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: ${{ matrix.vcpkg_triplet }}
          extra-args: >-
            --overlay-triplets=${{ github.workspace }}/custom-triplets
            --overlay-ports=${{ github.workspace }}/vcpkg-ports
          token: ${{ github.token }}
          github-binarycache: true
          cache-key: vcpkg-${{ matrix.vcpkg_triplet }}

      - name: Download AppImage Tools
        if: matrix.target == 'linux'
        run: |
          mkdir -p tools
          cd tools
          if [ ! -f linuxdeploy-x86_64.AppImage ]; then
            wget -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          fi
          if [ ! -f linuxdeploy-plugin-qt-x86_64.AppImage ]; then
            wget -c "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          fi
          if [ ! -f appimagetool-x86_64.AppImage ]; then
            wget -c "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          fi
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage appimagetool-x86_64.AppImage
          sudo ln -sf $(pwd)/linuxdeploy-x86_64.AppImage /usr/bin/linuxdeploy
          sudo ln -sf $(pwd)/linuxdeploy-plugin-qt-x86_64.AppImage /usr/bin/linuxdeploy-plugin-qt
          sudo ln -sf $(pwd)/appimagetool-x86_64.AppImage /usr/bin/appimagetool

      - name: Configure & Build (Unix)
        if: matrix.target != 'windows'
        run: |
          if [ -z "${QTDIR:-}" ]; then
            echo "QTDIR is not set."
            exit 1
          fi
          EXTRA_CMAKE_ARGS=""
          if [[ "${{ matrix.target }}" == macos-* ]]; then
            EXTRA_CMAKE_ARGS="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }}"
          fi
          cmake ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} \
            -B build \
            -S ${{ github.workspace }} \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/${{ matrix.install_prefix }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QTDIR}" \
            -DGDL_UI_GENERATE_TRANSLATIONS=on \
            -GNinja \
            ${{ matrix.cmake_extra }} \
            ${EXTRA_CMAKE_ARGS}
          cmake --build build --config Release --parallel
          if [ "${{ matrix.target }}" = "linux" ]; then
            cmake --install build --config Release --strip
          else
            cmake --install build --config Release
          fi

      - name: Package macOS DMG
        if: startsWith(matrix.target, 'macos-')
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          APP_PATH="${{ github.workspace }}/${{ matrix.install_prefix }}/GDownload.app"
          if [ ! -d "${APP_PATH}" ]; then
            echo "App bundle not found at ${APP_PATH}"
            exit 1
          fi
          DMG_DIR="${{ github.workspace }}/release_artifacts/${{ matrix.target }}"
          mkdir -p "${DMG_DIR}"
          if [[ "${REF}" == refs/tags/* ]]; then
            DMG_NAME="GDownload-${{ matrix.target }}-${REF_NAME}.dmg"
          else
            DMG_NAME="GDownload-${{ matrix.target }}-${RUN_NUMBER}.dmg"
          fi
          DMG_PATH="${DMG_DIR}/${DMG_NAME}"
          rm -f "${DMG_PATH}"
          create-dmg \
            --volname "GDownload" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "${DMG_PATH}" \
            "${APP_PATH}"
          echo "Created DMG at ${DMG_PATH}"

      - name: Build AppImage
        if: matrix.target == 'linux'
        id: build_appimage
        env:
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x scripts/build_appimage.sh
          RELEASE_DIR="${{ github.workspace }}/release_artifacts/linux"
          mkdir -p "$RELEASE_DIR"
          if [[ "${REF:-}" == refs/tags/* ]]; then
            APPIMAGE_BASENAME="gdownload-linux-${REF_NAME}.AppImage"
          else
            APPIMAGE_BASENAME="gdownload-linux-${RUN_NUMBER}.AppImage"
          fi
          APPIMAGE_PATH="$RELEASE_DIR/${APPIMAGE_BASENAME}"
          scripts/build_appimage.sh "${{ github.workspace }}/${{ matrix.install_prefix }}" "$APPIMAGE_PATH"
          echo "path=$APPIMAGE_PATH" >> "$GITHUB_OUTPUT"

      - name: Configure & Build (Windows)
        if: matrix.target == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.msvc_arch }}
          if "%QTDIR%"=="" (
            echo QTDIR is not set.
            exit /b 1
          )
          cmake ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} -B build -S %GITHUB_WORKSPACE% -DCMAKE_INSTALL_PREFIX=%GITHUB_WORKSPACE%\${{ matrix.install_prefix }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%QTDIR% -DGDL_UI_GENERATE_TRANSLATIONS=on -GNinja -DCMAKE_CXX_FLAGS="-D_WIN32_WINNT=0x0A00"
          cmake --build build --config Release --parallel
          mkdir windows_pdb
          copy /Y build\Release\bin\*.pdb windows_pdb
          del /S /Q build\Release\bin\*.pdb
          del /S /Q build\Release\bin\*.lib
          del /S /Q build\Release\bin\*.exp
          cmake --install build --config Release

      - name: Install Inno Setup
        if: matrix.target == 'windows'
        run: |
          choco install innosetup -y --no-progress
          # 验证安装
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            Write-Host "Inno Setup installed at: C:\ Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
            Write-Host "Inno Setup not found in default location"
            Get-ChildItem "C:\Program Files*" -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue
          }
        shell: pwsh

      - name: Build Windows Installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          # 直接使用绝对路径调用 ISCC (Inno Setup Compiler)
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC not found at $iscc"
            exit 1
          }
          & $iscc /V5 "$env:GITHUB_WORKSPACE\build\release\windows_installer.iss"

      - name: Collect Windows Installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release_artifacts/windows"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $setupFiles = Get-ChildItem "$env:GITHUB_WORKSPACE\build\release\GDownloader_windows_*.exe"
          if (-not $setupFiles) {
            Write-Error "No installer exe found under build\release"
            exit 1
          }
          foreach ($file in $setupFiles) {
            Copy-Item $file.FullName -Destination $releaseDir -Force
          }

      - name: Create AppImage zsync
        if: matrix.target == 'linux'
        env:
          APPIMAGE_PATH: ${{ steps.build_appimage.outputs.path }}
        run: |
          if [ -z "${APPIMAGE_PATH:-}" ] || [ ! -f "${APPIMAGE_PATH}" ]; then
            echo "AppImage not found, skipping zsync generation"
          else
            export APPIMAGE_EXTRACT_AND_RUN=1
            APPIMAGE_DIR="$(dirname "${APPIMAGE_PATH}")"
            APPIMAGE_FILE="$(basename "${APPIMAGE_PATH}")"
            pushd "${APPIMAGE_DIR}" >/dev/null
            appimagetool -u "gh-releases-zsync|cool2528|GDownload|latest|gdownload-*.AppImage.zsync" \
              ${{ github.workspace }}/${{ matrix.install_prefix }} \
              "${APPIMAGE_FILE}"
            popd >/dev/null
            if [ -f "${APPIMAGE_PATH}.zsync" ]; then
              echo "zsync generated at ${APPIMAGE_PATH}.zsync"
            else
              echo "AppImage .zsync file not found after generation" >&2
              exit 1
            fi
          fi

      - name: Upload Build Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-build-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/${{ matrix.install_prefix }}
          if-no-files-found: warn

      - name: Upload Architecture Artifact (macOS only)
        if: startsWith(matrix.target, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ github.workspace }}/${{ matrix.install_prefix }}/GDownload.app
          retention-days: 1

      - name: Upload Release Artifact
        if: startsWith(github.ref, 'refs/tags/') && matrix.release_glob != ''
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file_glob: true
          file: ${{ matrix.release_glob }}
          overwrite: true

  merge-macos-universal:
    needs: build
    if: |
      !cancelled() &&
      (needs.build.result == 'success')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ARM64 Build
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-app
          path: build-arm64/GDownload.app

      - name: Download x64 Build
        uses: actions/download-artifact@v4
        with:
          name: macos-x64-app
          path: build-x64/GDownload.app

      - name: Merge Universal Binary
        run: |
          chmod +x scripts/merge_macos_bundle.sh
          ./scripts/merge_macos_bundle.sh \
            build-arm64/GDownload.app \
            build-x64/GDownload.app \
            GDownload.app

      - name: Verify Universal Binary
        run: |
          echo "验证主可执行文件:"
          file GDownload.app/Contents/MacOS/GDownload
          lipo -info GDownload.app/Contents/MacOS/GDownload

          echo "验证所有 .dylib 文件:"
          find GDownload.app -name "*.dylib" -exec sh -c 'echo "{}"; lipo -info "{}"' \;

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "GDownload" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "GDownload-Universal.dmg" \
            "GDownload.app"

      - name: Upload Universal Build
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-dmg
          path: GDownload-Universal.dmg

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: GDownload-Universal.dmg
          overwrite: true
