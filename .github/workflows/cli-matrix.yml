name: CLI-All-Platforms

on:
  push:
    tags:
      - '*'
    branches:
      - main
  workflow_dispatch:

jobs:
  # 创建 Release（只运行一次，避免重复创建）
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare Release Notes
        id: release_body
        run: |
          git fetch --tags --force
          # 读取 CHANGELOG.md 文件内容
          if [ -f "CHANGELOG.md" ]; then
            CHANGELOG_CONTENT=$(cat CHANGELOG.md)
            # 处理换行与百分号，适配 GitHub 输出格式
            CHANGELOG_CONTENT="${CHANGELOG_CONTENT//'%'/'%25'}"
            CHANGELOG_CONTENT="${CHANGELOG_CONTENT//$'\n'/'%0A'}"
            CHANGELOG_CONTENT="${CHANGELOG_CONTENT//$'\r'/'%0D'}"
            echo "body=${CHANGELOG_CONTENT}" >> "$GITHUB_OUTPUT"
          else
            # 如果 CHANGELOG.md 不存在，回退到使用最后一个 commit 消息
            LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
            LAST_COMMIT_MSG="${LAST_COMMIT_MSG//'%'/'%25'}"
            LAST_COMMIT_MSG="${LAST_COMMIT_MSG//$'\n'/'%0A'}"
            echo "body=${LAST_COMMIT_MSG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release_body.outputs.body }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [create-release]
    if: |
      !cancelled() &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target: [linux, macos-arm64, macos-x64, windows]
        # macOS 构建说明：
        # - 分别构建 ARM64 和 x86_64 架构
        # - 通过 merge-macos-universal 任务合并为 Universal Binary
        # - 避免 vcpkg 在多架构模式下的构建失败问题
        include:
          - target: linux
            os: ubuntu-latest
            qt_version: 6.5.2
            qt_arch: gcc_64
            vcpkg_triplet: x64-linux-release
            install_prefix: linux_package
            release_glob: gdownload-*.AppImag*
            cmake_extra: ""
            pdb_archive: ""
          - target: macos-arm64
            os: macos-latest
            qt_version: 6.5.2
            qt_arch: clang_64
            vcpkg_triplet: arm64-osx-release
            install_prefix: macos_arm64_package
            cmake_arch: arm64
            artifact_name: macos-arm64-app
            release_glob: ""
            cmake_extra: "-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang"
            pdb_archive: ""
          - target: macos-x64
            os: macos-latest
            qt_version: 6.5.2
            qt_arch: clang_64
            vcpkg_triplet: x64-osx-release
            install_prefix: macos_x64_package
            cmake_arch: x86_64
            artifact_name: macos-x64-app
            release_glob: ""
            cmake_extra: "-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang"
            pdb_archive: ""
          - target: windows
            os: windows-latest
            qt_version: 6.5.2
            qt_arch: win64_msvc2019_64
            vcpkg_triplet: x64-windows-release
            install_prefix: windows_package
            release_glob: build/release/GDownloader_windows_*.exe
            msvc_arch: x64
            pdb_archive: windows_pdb.zip
            cmake_extra: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          modules: qt3d qtimageformats qtwebsockets qt5compat qtshadertools

      - name: Install Linux Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libdrm-dev libappimage-dev libxdg-basedir-dev xdg-utils-cxx xdg-utils-cxx-dev mesa-common-dev build-essential libssl-dev autoconf automake libtool wget vim-common desktop-file-utils pkgconf libgpgme-dev libglib2.0-dev libcairo2-dev librsvg2-dev libfuse-dev git libcurl4-openssl-dev argagg-dev libgcrypt20-dev libboost-dev liblzma-dev libzstd-dev zlib1g-dev libarchive-dev libx11-dev libxpm-dev ninja-build

      - name: Install macOS Tools
        if: matrix.target == 'macos'
        run: |
          brew install create-dmg ninja

      - name: Cache AppImage Tools
        if: matrix.target == 'linux'
        uses: actions/cache@v4
        with:
          path: tools
          key: appimage-tools-${{ runner.os }}-${{ hashFiles('.github/workflows/cli-matrix.yml') }}

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
            ~/.cache/vcpkg/archives
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
            ~/Library/Caches/vcpkg/archives
          key: vcpkg-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'custom-triplets/**') }}
          restore-keys: |
            vcpkg-${{ matrix.vcpkg_triplet }}-
            vcpkg-

      - name: Setup vcpkg
        id: vcpkg
        uses: johnwason/vcpkg-action@v6
        env:
          VCPKG_MAX_CONCURRENCY: 4
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: ${{ matrix.vcpkg_triplet }}
          extra-args: --overlay-triplets=${{ github.workspace }}/custom-triplets
          token: ${{ github.token }}
          github-binarycache: true
          cache-key: vcpkg-${{ matrix.vcpkg_triplet }}

      - name: Download AppImage Tools
        if: matrix.target == 'linux'
        run: |
          mkdir -p tools
          cd tools
          if [ ! -f linuxdeploy-x86_64.AppImage ]; then
            wget -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          fi
          if [ ! -f linuxdeploy-plugin-qt-x86_64.AppImage ]; then
            wget -c "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          fi
          if [ ! -f appimagetool-x86_64.AppImage ]; then
            wget -c "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          fi
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage appimagetool-x86_64.AppImage
          sudo ln -sf $(pwd)/linuxdeploy-x86_64.AppImage /usr/bin/linuxdeploy
          sudo ln -sf $(pwd)/linuxdeploy-plugin-qt-x86_64.AppImage /usr/bin/linuxdeploy-plugin-qt
          sudo ln -sf $(pwd)/appimagetool-x86_64.AppImage /usr/bin/appimagetool

      - name: Configure & Build (Unix)
        if: matrix.target != 'windows'
        run: |
          export QTDIR="${Qt6_DIR}/../.."
          EXTRA_CMAKE_ARGS=""
          if [[ "${{ matrix.target }}" == macos-* ]]; then
            EXTRA_CMAKE_ARGS="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }}"
          fi
          cmake ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} \
            -B build \
            -S ${{ github.workspace }} \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/${{ matrix.install_prefix }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QTDIR}" \
            -DGDL_UI_GENERATE_TRANSLATIONS=on \
            -GNinja \
            ${{ matrix.cmake_extra }} \
            ${EXTRA_CMAKE_ARGS}
          cmake --build build --config Release --parallel
          if [ "${{ matrix.target }}" = "linux" ]; then
            cmake --install build --config Release --strip
          else
            cmake --install build --config Release
          fi

      - name: Configure & Build (Windows)
        if: matrix.target == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.msvc_arch }}
          set QTDIR=%Qt6_DIR%\..\..
          cmake ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} -B build -S %GITHUB_WORKSPACE% -DCMAKE_INSTALL_PREFIX=%GITHUB_WORKSPACE%\${{ matrix.install_prefix }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%QTDIR% -DGDL_UI_GENERATE_TRANSLATIONS=on -GNinja -DCMAKE_CXX_FLAGS="-D_WIN32_WINNT=0x0A00"
          cmake --build build --config Release --parallel
          mkdir windows_pdb
          copy /Y build\Release\bin\*.pdb windows_pdb
          del /S /Q build\Release\bin\*.pdb
          del /S /Q build\Release\bin\*.lib
          del /S /Q build\Release\bin\*.exp
          cmake --install build --config Release

      - name: Package PDB
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path windows_pdb -DestinationPath ${{ matrix.pdb_archive }} -Force

      - name: Install NSIS
        if: matrix.target == 'windows'
        run: |
          choco install nsis -y --no-progress
          # 验证安装
          if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
            Write-Host "NSIS installed at: C:\Program Files (x86)\NSIS\makensis.exe"
          } else {
            Write-Host "NSIS not found in default location"
            Get-ChildItem "C:\Program Files*" -Recurse -Filter "makensis.exe" -ErrorAction SilentlyContinue
          }
        shell: pwsh

      - name: Build Windows Installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          # 直接使用绝对路径调用 makensis
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            Write-Error "makensis not found at $makensis"
            exit 1
          }
          & $makensis -V4 "$env:GITHUB_WORKSPACE\build\release\windows_installer.nsi"

      - name: Create AppImage zsync
        if: matrix.target == 'linux'
        run: |
          APPIMAGE_NAME=$(find ${{ github.workspace }} -maxdepth 1 -name "*.AppImage" | head -n 1)
          if [ -z "$APPIMAGE_NAME" ]; then
            echo "AppImage not found, skipping zsync generation"
          elif [ ! -f "${{ github.workspace }}/${{ matrix.install_prefix }}/gdownload.desktop" ]; then
            appimagetool -u "gh-releases-zsync|cool2528|GDownload|latest|gdownload-*.AppImage.zsync" ${{ github.workspace }}/${{ matrix.install_prefix }} "$APPIMAGE_NAME"
          fi

      - name: Upload Build Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-build-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/${{ matrix.install_prefix }}
          if-no-files-found: warn

      - name: Upload Architecture Artifact (macOS only)
        if: startsWith(matrix.target, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ github.workspace }}/${{ matrix.install_prefix }}/GDownload.app
          retention-days: 1

      - name: Upload Release Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file_glob: true
          file: ${{ matrix.release_glob }}
          overwrite: false

      - name: Upload Windows PDB
        if: matrix.target == 'windows' && startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: ${{ matrix.pdb_archive }}
          overwrite: false

  merge-macos-universal:
    needs: build
    if: |
      !cancelled() &&
      (needs.build.result == 'success')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ARM64 Build
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-app
          path: build-arm64

      - name: Download x64 Build
        uses: actions/download-artifact@v4
        with:
          name: macos-x64-app
          path: build-x64

      - name: Merge Universal Binary
        run: |
          chmod +x scripts/merge_macos_bundle.sh
          ./scripts/merge_macos_bundle.sh \
            build-arm64/GDownload.app \
            build-x64/GDownload.app \
            GDownload.app

      - name: Verify Universal Binary
        run: |
          echo "验证主可执行文件:"
          file GDownload.app/Contents/MacOS/GDownload
          lipo -info GDownload.app/Contents/MacOS/GDownload

          echo "验证所有 .dylib 文件:"
          find GDownload.app -name "*.dylib" -exec sh -c 'echo "{}"; lipo -info "{}"' \;

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "GDownload" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "GDownload-Universal.dmg" \
            "GDownload.app"

      - name: Upload Universal Build
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-dmg
          path: GDownload-Universal.dmg

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: GDownload-Universal.dmg
          overwrite: false
