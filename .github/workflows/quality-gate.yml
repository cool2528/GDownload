name: Quality Gate

# 触发说明:
# - push 只监听 develop:本仓库工作流是 develop 测试后 fast-forward 合入 main,
#   main 收到的每个 commit 都已在 develop 跑过同一套测试,再跑一遍纯属重复
# - 纯文档变更(paths-ignore)不触发,省去无意义的完整构建
on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshot/**'
      - 'LICENSE*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-debug-tests:
    runs-on: windows-latest
    # 冷启动(vcpkg Debug 依赖全量编译)可能超过 60 分钟。此前 45 分钟上限导致
    # 死循环:超时被杀 -> actions/cache 的保存(post)步骤不执行 -> 缓存永远存不上
    # -> 下次依旧全冷 -> 再超时。放宽到 90 分钟让首次运行得以完成并写入缓存,
    # 之后的运行命中缓存,稳态耗时预计 15-25 分钟
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.1
          arch: win64_msvc2022_64
          modules: qt3d qtimageformats qtwebsockets qt5compat qtshadertools

      - name: Set QTDIR
        shell: pwsh
        run: |
          $qtDir = if ($env:QT_ROOT_DIR) { $env:QT_ROOT_DIR } else { Split-Path (Split-Path $env:Qt6_DIR -Parent) -Parent }
          if (-not $qtDir) {
            throw "QTDIR could not be determined after installing Qt."
          }
          "QTDIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-x64-windows-debug-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'custom-triplets/**', 'vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-x64-windows-debug-
            vcpkg-x64-windows-

      - name: Setup vcpkg
        id: vcpkg
        uses: johnwason/vcpkg-action@v6
        env:
          VCPKG_MAX_CONCURRENCY: 4
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: x64-windows
          extra-args: >-
            --overlay-triplets=${{ github.workspace }}/custom-triplets
            --overlay-ports=${{ github.workspace }}/vcpkg-ports
          token: ${{ github.token }}
          github-binarycache: true
          cache-key: vcpkg-x64-windows-debug

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.10

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # MSVC 默认 Debug 调试信息格式为 /Zi(独立 PDB),sccache 无法缓存这类
      # 编译调用;切到 /Z7(嵌入式,CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded)
      # 使编译可被缓存。该抽象需要 CMP0141=NEW(项目 cmake_minimum_required 3.18
      # 时默认 OLD),通过 CMAKE_POLICY_DEFAULT_CMP0141 显式启用,仅影响 CI 测试构建
      - name: Configure Debug tests
        shell: cmd
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          where cl
          set "CC=cl"
          set "CXX=cl"
          cmake ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} -B build -S %GITHUB_WORKSPACE% -GNinja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH=%QTDIR% -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_CXX_FLAGS="-D_WIN32_WINNT=0x0A00" -DBUILD_TESTS=ON -DGDL_UI_GENERATE_TRANSLATIONS=OFF -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build Debug
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: cmake --build build --config Debug --parallel

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Upload QML UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qml-ui-${{ github.run_id }}
          path: build/test_artifacts/qml_ui
          if-no-files-found: warn
          retention-days: 14
