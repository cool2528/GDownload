name: SignPath-Secret-Debug

# 一次性诊断工作流:校验 SIGNPATH_API_TOKEN secret 的完整性(长度+SHA-256)。
# 只输出哈希与长度,不泄露任何 secret 内容;验证完成后删除本文件。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret shape
        env:
          T: ${{ secrets.SIGNPATH_API_TOKEN }}
          O: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          P: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          echo "token length: ${#T}"
          echo "token sha256: $(printf '%s' "$T" | sha256sum | cut -d' ' -f1)"
          if [[ "$T" =~ [[:space:]] ]]; then echo "token has whitespace: YES"; else echo "token has whitespace: no"; fi
          echo "org: [$O]"
          echo "policy: [$P]"
