<?xml version="1.0" encoding="UTF-8"?>
<!--
  macOS 托盘图标模板 - 极简版

  最佳实践版本：
  - 最大化可读性
  - 粗线条确保小尺寸清晰
  - 符合 macOS Human Interface Guidelines
-->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- 纯色下载图标 -->
  <g id="minimal-download">
    <!-- 下载箭头 - 使用实心填充提高可见性 -->
    <path fill="black" d="
      M 8 2
      L 8 9
      L 5.5 6.5
      L 4 8
      L 8 12
      L 12 8
      L 10.5 6.5
      L 8 9
      Z
    "/>

    <!-- 底部横线 - 加粗版本 -->
    <rect x="2" y="13" width="12" height="2" fill="black"/>
  </g>
</svg>