<?xml version="1.0" encoding="UTF-8"?>
<!--
  macOS 托盘图标模板 - Apple 风格专业版

  设计参考：
  - Apple 官方应用托盘图标
  - SF Symbols 设计语言
  - 2pt 线宽标准
  - 16x16 画布，14x14 安全区域
-->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- 使用 Apple 风格的圆角和线宽 -->
  <g id="apple-style-download">

    <!-- 方案1：线条版本（推荐） -->
    <g id="outline-version">
      <!-- 下载箭头 -->
      <path d="M 8 2 L 8 9.5"
            stroke="black"
            stroke-width="2"
            stroke-linecap="round"
            fill="none"/>

      <!-- 箭头尖端 -->
      <path d="M 4.5 7 L 8 10.5 L 11.5 7"
            stroke="black"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"/>

      <!-- 底部托盘 -->
      <path d="M 3 14 L 13 14"
            stroke="black"
            stroke-width="2"
            stroke-linecap="round"
            fill="none"/>
    </g>

  </g>
</svg>