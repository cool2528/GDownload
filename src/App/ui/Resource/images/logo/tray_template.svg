<?xml version="1.0" encoding="UTF-8"?>
<!--
  macOS 托盘图标模板

  设计原则：
  1. 纯黑色填充 (#000000) - 系统会自动处理颜色
  2. 透明背景 - 无背景元素
  3. 简洁设计 - 小尺寸下清晰可见
  4. 16x16 基准尺寸 - macOS 托盘标准尺寸

  使用说明：
  - 在 QML 中设置 icon.mask: true 启用模板模式
  - 系统会自动根据菜单栏主题调整颜色（深色/浅色）
-->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- 下载箭头图标 - 简洁版本 -->
  <g id="download-icon">
    <!-- 向下箭头主体 -->
    <path d="M8 1 L8 10 M4 7 L8 11 L12 7"
          fill="none"
          stroke="black"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- 底部横线（表示下载目标） -->
    <rect x="3" y="13" width="10" height="1.5" rx="0.5" fill="black"/>
  </g>
</svg>