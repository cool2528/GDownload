<?xml version="1.0" encoding="UTF-8"?>
<!--
  macOS 托盘图标模板 - GDownload 品牌版

  设计特点：
  1. 融合 "G" 字母与下载概念
  2. 使用圆角设计，更现代
  3. 适配 16x16 和 18x18 两种常见尺寸
-->
<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 定义可重用的样式 -->
    <style>
      .template-fill { fill: black; fill-opacity: 1; }
      .template-stroke { stroke: black; stroke-opacity: 1; fill: none; }
    </style>
  </defs>

  <!-- 方案一：G字母结合下载箭头 -->
  <g id="g-download">
    <!-- G 字母轮廓，同时形成下载容器 -->
    <path class="template-fill"
          d="M 9 2
             C 5.5 2 2.5 5 2.5 9
             C 2.5 13 5.5 16 9 16
             C 11 16 12.5 15 13.5 13.5
             L 13.5 11.5
             L 10 11.5
             L 10 10
             L 15 10
             L 15 14
             C 13.5 15.5 11.5 17 9 17
             C 4.5 17 1 13.5 1 9
             C 1 4.5 4.5 1 9 1
             C 11.5 1 13.5 2 15 3.5
             L 14 4.5
             C 12.8 3.3 11 2.5 9 2.5
             Z"/>

    <!-- 内部下载箭头 -->
    <g transform="translate(9, 9)">
      <path class="template-stroke"
            d="M 0 -3 L 0 2"
            stroke-width="1.2"/>
      <path class="template-stroke"
            d="M -2 0 L 0 2 L 2 0"
            stroke-width="1.2"
            stroke-linejoin="round"/>
    </g>
  </g>
</svg>